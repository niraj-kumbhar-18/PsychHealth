<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Research-based student psychological health assessment using PSS-10 and academic covariance analysis.">
    <title>PsychHealth — Student Wellbeing Assessment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens.css">
</head>
<body>
    <div id="app" class="app-layout">
        <!-- Mobile Top Bar (Mobile-first, visible < 1024px) -->
        <header class="mobile-header">
            <button id="btn-mobile-menu" class="btn-icon" aria-label="Open navigation menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <a href="#/" class="mobile-brand">PsychHealth</a>
            <button id="btn-theme-mobile" class="btn-icon" aria-label="Toggle dark mode" title="Switch theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </header>

        <!-- Permanent Sidebar (Desktop >= 1024px) / Slide-out Drawer (Mobile < 1024px) -->
        <aside id="app-sidebar" class="app-sidebar">
            <div class="sidebar-header">
                <a href="#/" class="sidebar-brand">
                    <span class="brand-text">PsychHealth</span>
                </a>
                <button id="btn-sidebar-close" class="btn-icon mobile-only" aria-label="Close navigation menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav"></nav>

            <div class="sidebar-footer">
                <div class="participant-badge" id="sidebar-participant">
                    <div class="participant-dot"></div>
                    <div class="participant-info">
                        <span class="participant-title">Participant Session</span>
                        <span class="participant-sub" id="sidebar-profile-sub">Active · Anonymous</span>
                    </div>
                </div>
                <div class="sidebar-footer-actions">
                    <button id="btn-theme" class="btn-icon" aria-label="Toggle theme" title="Switch theme">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <button id="btn-reset-data" class="btn-icon" aria-label="Reset session data" title="Reset all data">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Mobile Drawer Backdrop Overlay -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Main Viewport Area -->
        <div class="content-wrapper">
            <main id="main" class="main-container"></main>
        </div>

        <!-- Mobile Bottom Navigation Bar (Visible on smartphones < 1024px) -->
        <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
            <a href="#/dashboard" class="bottom-nav-item" data-route="dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="#/pss" class="bottom-nav-item" data-route="pss">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
                <span>Assess</span>
            </a>
            <a href="#/plan" class="bottom-nav-item" data-route="plan">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>Plan</span>
            </a>
            <a href="#/progress" class="bottom-nav-item" data-route="progress">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>Insights</span>
            </a>
            <a href="#/profile" class="bottom-nav-item" data-route="profile">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Application Modules -->
    <script src="js/data.js"></script>
    <script src="js/cohort_data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/pss.js"></script>
    <script src="js/recommendations.js"></script>
    <script src="js/simulator.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
